<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KumejimaLab AR</title>

  <!-- model-viewer 本体（CDN） -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .viewer-wrap {
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: #f6f6f6;
      border-radius: 12px;
    }

    .note {
      color: #444;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 12px;
    }

    /* デフォルトの小さいARボタンを非表示にする */
    model-viewer::part(ar-button) {
      display: none;
    }

    /* 画面中央の大きな「AR体験する」ボタン */
    .ar-center-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 32px;
      border-radius: 999px;
      border: none;
      font-size: 18px;
      font-weight: 600;
      background: #007aff;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ar-center-button:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    /* スマホ向けに少し小さく */
    @media (max-width: 480px) {
      .ar-center-button {
        font-size: 16px;
        padding: 12px 24px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>KumejimaLab - AR viewer</h1>

    <div class="viewer-wrap">
      <model-viewer id="lab"
        src="KumejimaLab_All.glb"
        ios-src="KumejimaLab_All.usdz"
        alt="KumejimaLab avatars"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        autoplay
        animation-loop
        shadow-intensity="1"
        exposure="1.0"
        environment-image="neutral"
        poster=""
        touch-action="pan-y">
      </model-viewer>

      <!-- 画面中央の大きなARボタン -->
      <button id="customArButton" class="ar-center-button">
        AR体験
      </button>

  <script>
    const mv = document.querySelector('#lab');
    const customArButton = document.querySelector('#customArButton');

    // 中央の大きなボタンからARを起動
    customArButton.addEventListener('click', () => {
      if (mv.canActivateAR) {
        mv.activateAR();
      } else {
        alert('この端末またはブラウザはARに対応していません。');
      }
    });
  </script>
</body>
</html>
