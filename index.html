<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KumejimaLab AR</title>

  <!-- model-viewer 本体（CDN） -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin:0; font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
    model-viewer { width: 100%; height: 70vh; background: #f6f6f6; border-radius: 12px; }
    .note { color:#444; font-size: 14px; line-height:1.6; margin-top:12px; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>KumejimaLab - AR viewer</h1>

    <model-viewer id="lab"
      src="KumejimaLab_All.glb"
      ios-src="KumejimaLab_All.usdz"
      alt="KumejimaLab avatars"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-button-text="AR体験"
      camera-controls
      autoplay
      animation-loop
      shadow-intensity="1"
      exposure="1.0"
      environment-image="neutral"
      poster=""
      touch-action="pan-y">
    </model-viewer>

    <p class="note">
      • AndroidのARでは <code>KumejimaLab_All.glb</code> が利用されます。<br/>
      • iPhoneのAR（Quick Look）では <code>KumejimaLab_All.usdz</code> が利用されます。<br/>
      • ページ内の表示はGLBのままでOKです。
    </p>
  </div>

  <script>
    const mv = document.querySelector('#lab');

    // 通常表示の元サイズを保存
    const originalScale = { x: 1, y: 1, z: 1 };

    // モデル読み込み時に元スケールを取得
    mv.addEventListener('load', () => {
      if (mv.model) {
        originalScale.x = mv.model.scale.x;
        originalScale.y = mv.model.scale.y;
        originalScale.z = mv.model.scale.z;
      }
    });

    // AR中だけモデルを縮小 (8% = 0.08)
    mv.addEventListener('ar-status', (event) => {
      // AR開始
      if (event.detail.status === 'session-started') {
        if (mv.model) {
          mv.model.scale.set(0.08, 0.08, 0.08);  // ← 8%に縮小
        }
      }

      // AR終了
      if (event.detail.status === 'not-presenting') {
        if (mv.model) {
          mv.model.scale.set(
            originalScale.x,
            originalScale.y,
            originalScale.z
          ); // 元サイズに戻す
        }
      }
    });
  </script>

</body>
</html>
